<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="samotate — SAM-assisted image annotation with YOLO export">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#22184a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a4d"/>
      <stop offset="1" stop-color="#141b33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="760" y="46" width="460" height="248" rx="14"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#grid)"/>
  <circle cx="1120" cy="-40" r="260" fill="#7c3aed" fill-opacity="0.10"/>
  <circle cx="120" cy="400" r="240" fill="#2563eb" fill-opacity="0.10"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="72" y="96" width="34" height="34" rx="4" fill="none" stroke="#34d399" stroke-width="3.5"/>
    <rect x="66" y="90" width="12" height="12" rx="2" fill="#34d399"/>
    <rect x="100" y="124" width="12" height="12" rx="2" fill="#34d399"/>
    <text x="128" y="132" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#title)">samotate</text>
    <text x="72" y="182" font-size="24" font-weight="500" fill="#c7d2fe">SAM-assisted image annotation</text>
    <text x="72" y="214" font-size="24" font-weight="500" fill="#c7d2fe">with one-click YOLO dataset export.</text>

    <!-- pills -->
    <g font-size="15" font-weight="600">
      <rect x="72" y="248" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="138" y="270" text-anchor="middle" fill="#e0e7ff">text prompts</text>
      <rect x="214" y="248" width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="274" y="270" text-anchor="middle" fill="#e0e7ff">click-to-box</text>
      <rect x="344" y="248" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="402" y="270" text-anchor="middle" fill="#e0e7ff">any classes</text>
      <rect x="470" y="248" width="114" height="34" rx="17" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.55"/>
      <text x="527" y="270" text-anchor="middle" fill="#a7f3d0">YOLO-ready</text>
    </g>
  </g>

  <!-- annotation scene -->
  <rect x="760" y="46" width="460" height="248" rx="14" fill="url(#scene)"/>
  <g clip-path="url(#frame)">
    <!-- ground + abstract objects -->
    <rect x="760" y="226" width="460" height="68" fill="#0f1529"/>
    <ellipse cx="868" cy="196" rx="58" ry="40" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="912" cy="150" r="24" fill="#f59e0b" fill-opacity="0.85"/>
    <path d="M900 132 l8 -18 l8 16 z M920 132 l8 -16 l6 18 z" fill="#f59e0b" fill-opacity="0.85"/>
    <ellipse cx="1050" cy="200" rx="66" ry="36" fill="#60a5fa" fill-opacity="0.85"/>
    <circle cx="1112" cy="168" r="26" fill="#60a5fa" fill-opacity="0.85"/>
    <ellipse cx="1126" cy="146" rx="9" ry="16" fill="#60a5fa" fill-opacity="0.85"/>
    <circle cx="1170" cy="96" r="18" fill="#f472b6" fill-opacity="0.55"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <!-- accepted box: cat -->
    <rect x="800" y="108" width="150" height="132" rx="3" fill="#f59e0b" fill-opacity="0.08" stroke="#fbbf24" stroke-width="3"/>
    <rect x="800" y="84" width="92" height="24" rx="3" fill="#fbbf24"/>
    <text x="808" y="101" fill="#1f1300">cat 0.94</text>

    <!-- accepted box: dog -->
    <rect x="974" y="122" width="176" height="118" rx="3" fill="#60a5fa" fill-opacity="0.08" stroke="#60a5fa" stroke-width="3"/>
    <rect x="974" y="98" width="94" height="24" rx="3" fill="#60a5fa"/>
    <text x="982" y="115" fill="#041a33">dog 0.88</text>

    <!-- SAM suggestion (dashed) -->
    <rect x="1146" y="72" width="48" height="48" rx="3" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>

  <!-- resize handles -->
  <g fill="#ffffff" stroke="#fbbf24" stroke-width="2">
    <rect x="795" y="103" width="10" height="10" rx="2"/>
    <rect x="945" y="103" width="10" height="10" rx="2"/>
    <rect x="795" y="235" width="10" height="10" rx="2"/>
    <rect x="945" y="235" width="10" height="10" rx="2"/>
  </g>

  <!-- cursor -->
  <path d="M1168 92 l0 26 l7 -6 l5 11 l5 -2 l-5 -11 l9 -1 z" fill="#ffffff" stroke="#0b1020" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- prompt bar -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <rect x="776" y="254" width="300" height="28" rx="8" fill="#0b1020" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="790" y="273" fill="#a78bfa">prompt›</text>
    <text x="856" y="273" fill="#e0e7ff">"a cat", "a dog"</text>
    <rect x="1086" y="254" width="118" height="28" rx="8" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="1145" y="273" text-anchor="middle" fill="#a7f3d0" font-weight="700">export ↗</text>
  </g>
</svg>
