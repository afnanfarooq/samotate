[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samotate"
dynamic = ["version"]  # read from src/samotate/__init__.py
description = "SAM-assisted auto-labeling for object detection, with YOLO dataset export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "samotate contributors" }]
keywords = ["annotation", "labeling", "computer-vision", "yolo", "sam", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Only the `detect` stage needs SAM. SAM 3 itself is NOT on PyPI (install it from
# github.com/facebookresearch/sam3, see README); this extra adds what it needs but
# doesn't declare, as found when running it (numpy<2 also rules out OpenCV 4.12+).
sam = [
    "torch>=2.1",
    "torchvision",
    "einops",
    "pycocotools",
    "psutil",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.8,<4.12",
    "setuptools<81",  # sam3 still imports pkg_resources
]
dev = ["pytest>=7.4", "httpx>=0.26", "ruff>=0.3"]

[project.urls]
Homepage = "https://github.com/afnanfarooq/samotate"
Source = "https://github.com/afnanfarooq/samotate"
Issues = "https://github.com/afnanfarooq/samotate/issues"

[project.scripts]
samotate = "samotate.cli:main"

[tool.hatch.version]
path = "src/samotate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/samotate"]

[tool.hatch.build.targets.sdist]
include = ["src/samotate", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",   # FastAPI uses Depends() in defaults
    # Pydantic evaluates annotations at runtime, and `X | None` fails on
    # Python 3.9 (requires-python >= 3.9). Keep Optional[...] / Union[...].
    "UP007",
    "UP045",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
