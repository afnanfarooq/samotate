# Publish to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing, so no API token is stored anywhere. One-time
# setup on pypi.org: Account → Publishing → "Add a new pending publisher" with
#   project: samotate   owner: afnanfarooq   repo: samotate
#   workflow: publish.yml   environment: pypi
#
# To release: bump __version__ in src/samotate/__init__.py, merge to main, then
# create a GitHub release with tag v<version> (e.g. v0.1.0).
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release tag matches package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/samotate/__init__.py').read_text()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version   release tag: $GITHUB_REF_NAME"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
          ruff check .

      - name: Build and check distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/samotate/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
